<!DOCTYPE html>
<html lang="en" data-theme="brutalist" data-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Project Tracker{% endblock %}</title>

    <!-- FOUC prevention - apply theme before render -->
    <script>
    (function() {
      try {
        const theme = localStorage.getItem('project-tracker-theme') || 'brutalist';
        const mode = localStorage.getItem('project-tracker-mode') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-mode', mode);
      } catch(e) {}
    })();
    </script>

    <!-- Google Fonts for all themes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=VT323&family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Main stylesheet with theme support -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}

    <!-- Theme switcher script -->
    <script src="{{ url_for('static', filename='js/theme-switcher.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
